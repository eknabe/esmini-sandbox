# This workflow is limited to the externals/sumo project
name: Build SUMO on multiple platforms

on:
  push:
    branches: []

  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]

    steps:
    - uses: actions/checkout@v5

    - name: Build
      shell: bash
      run: |
        mkdir build_sumo
        cd build_sumo
        ../externals/sumo/generate_sumo_libs.sh
